# Prüft jede Änderung an main und jeden Pull Request.
#
# Bewusst ohne Electron: Syntaxprüfung und der Test des WLAN-Servers laufen mit
# reinem Node und brauchen weder Bildschirm noch heruntergeladene Binärdateien.
# Der Rauchtest über alle Ansichten braucht eine echte Fensterumgebung und wird
# deshalb lokal mit `npm test` gefahren.

name: Prüfung

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruefung:
    name: Syntax und WLAN-Server
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7.0.1

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Abhängigkeiten installieren
        # --ignore-scripts spart den Download der Electron-Binärdatei,
        # die für diese Prüfungen nicht gebraucht wird.
        run: npm ci --ignore-scripts

      - name: Syntax aller Module prüfen
        run: node scripts/check-syntax.js

      - name: Übersetzung prüfen
        run: node scripts/test-i18n.js --strict

      - name: Handy-Begleiter von aussen prüfen
        run: node scripts/test-companion.js

      - name: Verbindungen prüfen
        run: node scripts/test-connectors.js

      - name: Kalender-Ausgabe prüfen
        run: node scripts/test-calendar.js

      - name: Abgleich zwischen PCs prüfen
        run: node scripts/test-sync.js

      - name: Veröffentlichen prüfen
        run: |
          node scripts/test-publish.js
          node scripts/test-providers.js

  # Kleine Updates von Dependabot (Patch, Minor) werden übernommen, sobald alle
  # Prüfungen oben grün sind. Große Sprünge (Major) bleiben zum Ansehen liegen.
  abhaengigkeiten:
    name: Dependabot-Update übernehmen
    needs: pruefung
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Art des Updates lesen
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Patch und Minor übernehmen
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash --delete-branch "$PR"
